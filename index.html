<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Plumber Runner - 2D Platformer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 480px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 8px;
            overflow: hidden;
            border: 4px solid #333;
            background: #5c94fc;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Overlay UI Styling */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .overlay h1 {
            font-size: 38px;
            color: #ffcc00;
            text-shadow: 3px 3px 0px #d32f2f, 5px 5px 0px #000;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 2px;
        }

        .overlay p {
            font-size: 16px;
            color: #ffffff;
            margin-bottom: 25px;
            text-align: center;
            line-height: 1.6;
            max-width: 80%;
        }

        .btn {
            background: linear-gradient(180deg, #4caf50 0%, #2e7d32 100%);
            color: white;
            border: 3px solid #ffffff;
            padding: 12px 28px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn:hover {
            transform: scale(1.08);
            background: linear-gradient(180deg, #66bb6a 0%, #388e3c 100%);
            box-shadow: 0 6px 15px rgba(76, 175, 80, 0.6);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* On-Screen Touch Controls for Mobile Support */
        #touch-controls {
            display: none;
            position: absolute;
            bottom: 15px;
            width: 100%;
            padding: 0 20px;
            justify-content: space-between;
            z-index: 5;
        }

        .d-pad, .action-pad {
            display: flex;
            gap: 12px;
        }

        .touch-btn {
            width: 55px;
            height: 55px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            color: white;
            touch-action: manipulation;
        }

        .touch-btn:active {
            background: rgba(255, 255, 255, 0.6);
        }

        @media (max-width: 850px) {
            #game-container {
                width: 95vw;
                height: 57vw;
            }
            #touch-controls {
                display: flex;
            }
        }

        .controls-info {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
            text-align: center;
        }

        .key {
            background: #333;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid #555;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Canvas for Rendering Game -->
        <canvas id="gameCanvas" width="800" height="480"></canvas>

        <!-- Start Screen Overlay -->
        <div id="start-screen" class="overlay">
            <h1>SUPER PLUMBER RUNNER</h1>
            <p>
                Use <span class="key">←</span> <span class="key">→</span> to Move.<br>
                Press <span class="key">SPACEBAR</span> to Jump.<br>
                Jump on top of <strong style="color: #4caf50;">Turtles</strong> to defeat them! Avoid hitting them from the side!
            </p>
            <button class="btn" onclick="startGame()">Start Game</button>
        </div>

        <!-- Game Over Screen Overlay -->
        <div id="game-over-screen" class="overlay" style="display: none;">
            <h1 style="color: #f44336; text-shadow: 3px 3px 0px #b71c1c, 5px 5px 0px #000;">GAME OVER</h1>
            <p id="game-over-stats">Score: 0 | Coins: 0</p>
            <button class="btn" onclick="restartGame()">Try Again</button>
        </div>

        <!-- Win Screen Overlay -->
        <div id="win-screen" class="overlay" style="display: none;">
            <h1 style="color: #ffeb3b; text-shadow: 3px 3px 0px #f57f17, 5px 5px 0px #000;">YOU WIN!</h1>
            <p id="win-stats">Congratulations! You rescued the castle flag!</p>
            <button class="btn" onclick="restartGame()">Play Again</button>
        </div>

        <!-- Touch Controls for Mobile/Tablet -->
        <div id="touch-controls">
            <div class="d-pad">
                <div class="touch-btn" id="btn-left">←</div>
                <div class="touch-btn" id="btn-right">→</div>
            </div>
            <div class="action-pad">
                <div class="touch-btn" id="btn-jump" style="width:70px; border-radius:35px;">JUMP</div>
            </div>
        </div>
    </div>

    <div class="controls-info">
        Controls: <span class="key">ArrowLeft</span> / <span class="key">ArrowRight</span> = Move | <span class="key">Spacebar</span> = Jump
    </div>

    <script>
        // --- WEBAUDIO SOUND SYSTEM (No external assets required!) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'jump') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'stomp') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(250, now);
                    osc.frequency.exponentialRampToValueAtTime(60, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'coin') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(987.77, now); // B5
                    osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'die') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.linearRampToValueAtTime(100, now + 0.4);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'win') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                    osc.frequency.setValueAtTime(1046.50, now + 0.3); // C6
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                }
            } catch(e) {
                console.log("Audio play error:", e);
            }
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game Configuration & State Variables
        const GRAVITY = 0.55;
        let gameState = 'START'; // 'START', 'PLAYING', 'GAMEOVER', 'WIN'
        let cameraX = 0;
        let score = 0;
        let coinsCollected = 0;
        let lives = 3;

        // Key State Tracker
        const keys = {
            left: false,
            right: false,
            jump: false,
            jumpPressed: false
        };

        // Event Listeners for Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft') keys.left = true;
            if (e.code === 'ArrowRight') keys.right = true;
            if (e.code === 'Space') {
                if (!keys.jump) keys.jumpPressed = true;
                keys.jump = true;
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft') keys.left = false;
            if (e.code === 'ArrowRight') keys.right = false;
            if (e.code === 'Space') keys.jump = false;
        });

        // Touch Control Listeners
        const bindTouch = (id, keyName) => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                initAudio();
                if (keyName === 'jump') {
                    if (!keys.jump) keys.jumpPressed = true;
                }
                keys[keyName] = true;
            });
            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                keys[keyName] = false;
            });
        };
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');
        bindTouch('btn-jump', 'jump');


        // Player Object Definition
        class Player {
            constructor() {
                this.width = 32;
                this.height = 44;
                this.reset();
            }

            reset() {
                this.x = 80;
                this.y = 300;
                this.vx = 0;
                this.vy = 0;
                this.speed = 4.5;
                this.jumpStrength = -12.5;
                this.isGrounded = false;
                this.facingRight = true;
                this.invulnerable = 0; // Frames of invulnerability
            }

            update(platforms) {
                // Movement
                if (keys.left) {
                    this.vx = -this.speed;
                    this.facingRight = false;
                } else if (keys.right) {
                    this.vx = this.speed;
                    this.facingRight = true;
                } else {
                    this.vx = 0;
                }

                // Jump
                if (keys.jumpPressed && this.isGrounded) {
                    this.vy = this.jumpStrength;
                    this.isGrounded = false;
                    playSound('jump');
                }
                keys.jumpPressed = false; // Reset single trigger

                // Gravity
                this.vy += GRAVITY;

                // Move X and Check Collisions
                this.x += this.vx;
                if (this.x < 0) this.x = 0;

                // Move Y and Check Collisions
                this.y += this.vy;
                this.isGrounded = false;

                for (let plat of platforms) {
                    // Check bounding box intersection
                    if (this.x + this.width > plat.x &&
                        this.x < plat.x + plat.w &&
                        this.y + this.height > plat.y &&
                        this.y < plat.y + plat.h) {

                        // Falling down onto platform
                        if (this.vy > 0 && (this.y + this.height - this.vy) <= plat.y + 10) {
                            this.y = plat.y - this.height;
                            this.vy = 0;
                            this.isGrounded = true;
                        }
                        // Hitting platform from below
                        else if (this.vy < 0 && (this.y - this.vy) >= plat.y + plat.h - 10) {
                            this.y = plat.y + plat.h;
                            this.vy = 0;
                        }
                    }
                }

                // Decrement invulnerability timer
                if (this.invulnerable > 0) this.invulnerable--;

                // Fall off world check
                if (this.y > canvas.height + 100) {
                    playerHit();
                }
            }

            draw() {
                // Flash when invulnerable
                if (this.invulnerable % 4 > 2) return;

                ctx.save();
                ctx.translate(this.x - cameraX, this.y);

                // Flip context if facing left
                if (!this.facingRight) {
                    ctx.translate(this.width, 0);
                    ctx.scale(-1, 1);
                }

                // --- Draw Mario-Style Pixel Character ---
                // Overall Overalls (Blue)
                ctx.fillStyle = '#2196f3';
                ctx.fillRect(6, 18, 20, 22);

                // Shirt & Cap (Red)
                ctx.fillStyle = '#f44336';
                ctx.fillRect(6, 12, 20, 10); // Shirt
                ctx.fillRect(4, 2, 22, 8);   // Cap
                ctx.fillRect(16, 4, 12, 4);  // Cap Visor

                // Face / Skin Tone
                ctx.fillStyle = '#ffcc80';
                ctx.fillRect(8, 8, 16, 8);

                // Mustache / Eye
                ctx.fillStyle = '#4e342e';
                ctx.fillRect(16, 11, 8, 3); // Mustache
                ctx.fillRect(18, 9, 3, 3);  // Eye

                // Shoes (Brown)
                ctx.fillStyle = '#5d4037';
                ctx.fillRect(4, 38, 11, 6);
                ctx.fillRect(17, 38, 11, 6);

                // Buttons (Yellow)
                ctx.fillStyle = '#ffeb3b';
                ctx.fillRect(9, 24, 3, 3);
                ctx.fillRect(19, 24, 3, 3);

                ctx.restore();
            }
        }

        // Turtle Enemy Class
        class Turtle {
            constructor(x, y, range) {
                this.x = x;
                this.y = y;
                this.width = 34;
                this.height = 30;
                this.minX = x;
                this.maxX = x + range;
                this.vx = 1.2;
                this.alive = true;
                this.animFrame = 0;
            }

            update() {
                if (!this.alive) return;

                this.x += this.vx;
                if (this.x >= this.maxX) {
                    this.x = this.maxX;
                    this.vx = -Math.abs(this.vx);
                } else if (this.x <= this.minX) {
                    this.x = this.minX;
                    this.vx = Math.abs(this.vx);
                }

                this.animFrame = (this.animFrame + 0.05) % 2;
            }

            draw() {
                if (!this.alive) return;

                ctx.save();
                ctx.translate(this.x - cameraX, this.y);

                // Flip if moving right
                if (this.vx > 0) {
                    ctx.translate(this.width, 0);
                    ctx.scale(-1, 1);
                }

                // Green Shell
                ctx.fillStyle = '#4caf50';
                ctx.beginPath();
                ctx.arc(17, 18, 14, Math.PI, 0, false);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#2e7d32';
                ctx.stroke();

                // Shell Pattern Details
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(10, 10, 6, 6);
                ctx.fillRect(18, 10, 6, 6);

                // Yellow Head & Snout
                ctx.fillStyle = '#fbc02d';
                ctx.fillRect(2, 6, 12, 12);
                ctx.fillRect(0, 10, 6, 6);

                // Eye
                ctx.fillStyle = '#000000';
                ctx.fillRect(4, 8, 2, 4);

                // Feet Walking Animation
                ctx.fillStyle = '#fbc02d';
                const footOffset = Math.floor(this.animFrame) * 4;
                ctx.fillRect(6 + footOffset, 24, 8, 6);
                ctx.fillRect(20 - footOffset, 24, 8, 6);

                ctx.restore();
            }
        }

        // Coin Item Class
        class Coin {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 16;
                this.height = 20;
                this.collected = false;
                this.anim = 0;
            }

            update() {
                this.anim += 0.1;
            }

            draw() {
                if (this.collected) return;

                ctx.save();
                const scaleX = Math.abs(Math.sin(this.anim));
                ctx.translate(this.x - cameraX + this.width / 2, this.y + this.height / 2);
                ctx.scale(scaleX, 1);

                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.ellipse(0, 0, 8, 10, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#b78103';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            }
        }


        let player;
        let platforms = [];
        let turtles = [];
        let coins = [];
        let flag = { x: 0, y: 0, w: 20, h: 220 };

        function buildLevel() {
            player = new Player();
            platforms = [];
            turtles = [];
            coins = [];

            // Ground Platforms
            platforms.push({ x: 0, y: 400, w: 900, h: 80 });
            platforms.push({ x: 980, y: 400, w: 800, h: 80 });
            platforms.push({ x: 1850, y: 400, w: 1000, h: 80 });

            // Floating Brick Platforms
            // Section 1
            platforms.push({ x: 250, y: 280, w: 120, h: 28 });
            platforms.push({ x: 450, y: 220, w: 150, h: 28 });
            platforms.push({ x: 700, y: 280, w: 100, h: 28 });

            // Section 2
            platforms.push({ x: 1050, y: 300, w: 140, h: 28 });
            platforms.push({ x: 1250, y: 220, w: 160, h: 28 });
            platforms.push({ x: 1480, y: 280, w: 120, h: 28 });

            // Section 3 (Staircase to victory)
            platforms.push({ x: 1950, y: 340, w: 40, h: 60 });
            platforms.push({ x: 1990, y: 280, w: 40, h: 120 });
            platforms.push({ x: 2030, y: 220, w: 40, h: 180 });
            platforms.push({ x: 2070, y: 160, w: 40, h: 240 });

            // Enemies (Turtles)
            turtles.push(new Turtle(350, 370, 180));
            turtles.push(new Turtle(500, 190, 80));
            turtles.push(new Turtle(1080, 270, 80));
            turtles.push(new Turtle(1280, 190, 100));
            turtles.push(new Turtle(1400, 370, 250));
            turtles.push(new Turtle(1600, 370, 150));

            // Collectible Coins
            const addCoinRow = (startX, y, count) => {
                for (let i = 0; i < count; i++) {
                    coins.push(new Coin(startX + i * 35, y));
                }
            };

            addCoinRow(265, 230, 3);
            addCoinRow(470, 170, 4);
            addCoinRow(715, 230, 2);
            addCoinRow(1070, 250, 3);
            addCoinRow(1270, 170, 4);
            addCoinRow(1500, 230, 3);

            // Flagpole Endpoint
            flag = { x: 2400, y: 180, w: 10, h: 220 };
        }


        function playerHit() {
            if (player.invulnerable > 0) return;

            lives--;
            playSound('die');

            if (lives <= 0) {
                gameState = 'GAMEOVER';
                document.getElementById('game-over-stats').innerText = `Final Score: ${score} | Coins: ${coinsCollected}`;
                document.getElementById('game-over-screen').style.display = 'flex';
            } else {
                // Respawn
                player.reset();
                player.invulnerable = 60; // 1 sec invulnerability
            }
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            // Update Entities
            player.update(platforms);

            // Camera follow player smoothly
            cameraX = player.x - 200;
            if (cameraX < 0) cameraX = 0;

            // Update Turtles & Check Stomp / Hit Collisions
            for (let turtle of turtles) {
                if (!turtle.alive) continue;
                turtle.update();

                // Collision with player
                if (player.x + player.width > turtle.x &&
                    player.x < turtle.x + turtle.width &&
                    player.y + player.height > turtle.y &&
                    player.y < turtle.y + turtle.height) {

                    // Player Stomps Turtle from Above
                    if (player.vy > 0 && (player.y + player.height - player.vy) <= turtle.y + 12) {
                        turtle.alive = false;
                        player.vy = player.jumpStrength * 0.7; // Bounce off turtle
                        score += 200;
                        playSound('stomp');
                    } else {
                        // Turtle hits player from side
                        playerHit();
                    }
                }
            }

            // Update Coins
            for (let coin of coins) {
                if (coin.collected) continue;
                coin.update();

                if (player.x + player.width > coin.x &&
                    player.x < coin.x + coin.width &&
                    player.y + player.height > coin.y &&
                    player.y < coin.y + coin.height) {

                    coin.collected = true;
                    score += 100;
                    coinsCollected++;
                    playSound('coin');
                }
            }

            // Flagpole Win Condition
            if (player.x + player.width >= flag.x) {
                gameState = 'WIN';
                playSound('win');
                document.getElementById('win-stats').innerText = `You Cleared the Level!\nFinal Score: ${score} | Coins: ${coinsCollected}`;
                document.getElementById('win-screen').style.display = 'flex';
            }
        }

        function drawSkyAndClouds() {
            // Sky Background
            ctx.fillStyle = '#5c94fc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Fluffy Clouds
            ctx.fillStyle = '#ffffff';
            const cloudPositions = [100, 400, 700, 1100, 1500, 1900, 2300];
            for (let cx of cloudPositions) {
                let screenX = cx - cameraX * 0.3; // Parallax effect
                ctx.beginPath();
                ctx.arc(screenX, 80, 24, 0, Math.PI * 2);
                ctx.arc(screenX + 20, 70, 30, 0, Math.PI * 2);
                ctx.arc(screenX + 45, 80, 22, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawPlatforms() {
            for (let plat of platforms) {
                if (plat.x + plat.w < cameraX || plat.x > cameraX + canvas.width) continue;

                // Ground style vs Floating Block style
                if (plat.h >= 80) {
                    // Top Grass layer
                    ctx.fillStyle = '#4caf50';
                    ctx.fillRect(plat.x - cameraX, plat.y, plat.w, 16);
                    // Dirt layer
                    ctx.fillStyle = '#795548';
                    ctx.fillRect(plat.x - cameraX, plat.y + 16, plat.w, plat.h - 16);
                } else {
                    // Retro Brick Pattern
                    ctx.fillStyle = '#d84315';
                    ctx.fillRect(plat.x - cameraX, plat.y, plat.w, plat.h);
                    ctx.strokeStyle = '#3e2723';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(plat.x - cameraX, plat.y, plat.w, plat.h);
                }
            }
        }

        function drawFlagpole() {
            if (flag.x - cameraX > canvas.width || flag.x + flag.w < cameraX) return;

            // Pole
            ctx.fillStyle = '#cccccc';
            ctx.fillRect(flag.x - cameraX, flag.y, flag.w, flag.h);

            // Sphere Top
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(flag.x - cameraX + 5, flag.y, 12, 0, Math.PI * 2);
            ctx.fill();

            // Flag
            ctx.fillStyle = '#f44336';
            ctx.beginPath();
            ctx.moveTo(flag.x - cameraX + 10, flag.y + 10);
            ctx.lineTo(flag.x - cameraX + 60, flag.y + 30);
            ctx.lineTo(flag.x - cameraX + 10, flag.y + 50);
            ctx.fill();
        }

        function drawHUD() {
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px "Courier New", Courier, monospace';
            ctx.shadowColor = '#000';
            ctx.shadowBlur = 4;

            ctx.fillText(`SCORE: ${score}`, 20, 30);
            ctx.fillText(`COINS: 🪙 ${coinsCollected}`, 220, 30);
            ctx.fillText(`LIVES: ❤️ ${lives}`, 440, 30);

            ctx.shadowBlur = 0; // Reset shadow
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawSkyAndClouds();
            drawPlatforms();
            drawFlagpole();

            // Draw Entities
            for (let coin of coins) coin.draw();
            for (let turtle of turtles) turtle.draw();
            player.draw();

            drawHUD();
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // --- Game Flow Control Functions ---
        function startGame() {
            initAudio();
            document.getElementById('start-screen').style.display = 'none';
            score = 0;
            coinsCollected = 0;
            lives = 3;
            buildLevel();
            gameState = 'PLAYING';
        }

        function restartGame() {
            initAudio();
            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('win-screen').style.display = 'none';
            score = 0;
            coinsCollected = 0;
            lives = 3;
            buildLevel();
            gameState = 'PLAYING';
        }

        // Start Loop on Page Load
        window.onload = () => {
            buildLevel();
            gameLoop();
        };
    </script>
</body>
</html>
